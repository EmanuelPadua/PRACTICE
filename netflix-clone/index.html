<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix Clone</title>
</head>

<body>
    <nav class="logo-netflix">
        <div id="logo">
            <h2><strong>NETFLIX</strong></h2>
        </div>
    </nav>
    
    <main>
        <div id="title">
            <h1>Quem está assistindo?</h1>
        </div>
        
        <div class="top-profile">
            <div class="profile-cards">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcR7TOSenvx9ErEBNwJmIE5Et4PSPM3brnBHThhKWVOg&s=10"
                alt="profile1">
                <h2 class="name">João Pedro</h2>
            </div>
            
            <div class="profile-cards">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_0ktq5pFEz71BIDJbH0XXC9STcigP68GQy0j4jxhmOg&s=10"
                alt="profile2">
                <h2 class="name">Emanuel</h2>
            </div>
            
            <div class="profile-cards">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTx2D6sCXleGxQ-64l7JUkd_HLC8szG8TjpLh57e4mOSQ&s=10"
                alt="profile3">
                <h2 class="name">Vilson</h2>
            </div>
            
            <div class="profile-cards">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbDIaLHtf1MxGySEiBB30kG7H8Joqq8lpiN4W2MJq0wA&s=10"
                alt="profile4">
                <h2 class="name">Júlio</h2>
            </div>
            
            <div id="add-profile">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIKEJom9TgdZQyQ-tlkJgT0F8_ztPlSGdEjVQfuEha_A&s=10"
                alt="add profile">
                <h2>Adicionar perfil</h2>
            </div>
        </div>
        
        <div id="btn-manage">
            <button>Gerenciar perfis</button>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>

</html>
